<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This is the contact link for our website, designed to allow customers to contact our white water Rafting company">
    <meta name="author" content="Douglas Caceres">
    <title>Contact us and Bonito River Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="main-header">
        <div class="logo">
            <img src="images/z-boat.png" alt="orange white water raft" width="200">
        </div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="title">
            <h1>Bonito River Rafting</h1>
            <h2>115 Powell Road</h2>
            <h2>Powell Idaho</h2>
            <h2>(208) 942-3405</h2>
            <h2>contactus@bonitoriver.com</h2>
        </div>
        <div class="map"><iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3779.921843694607!2d-114.72087888817961!3d46.510081900715754!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x535ef0f3aca8698b%3A0x591e2ceeb23672e!2sPowell%20Campground!5e1!3m2!1ses!2sgt!4v1770488273593!5m2!1ses!2sgt"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email:</label>
            <input type="text" id="email" name="email">
            <p>General Message</p>
            <label for="general">General Inquiry</label>
            <input type="radio" id="general" name="selection">
            <label for="reservation">Reservation Question</label>
            <input type="radio" id="reservation" name="selection">
            <label for="website">Website Suggestion</label>
            <input type="radio" id="website" name="selection">


            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <label for="subscription">Please subscribe me to the monthly newsletter</label>
            <input type="checkbox" id="subscription" name="subscription">

            <button type="submit">Get in touch!</button>
        </form>


        <section class="staff">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/jacob-ceo.jpeg" alt="photo of Jacob Martin" width="125">
                <figcaption>Jacob Martin - CEO</figcaption>
            </figure>
            <figure>
                <img src="images/alisa-rafter.jpeg" alt="photo of Alisa Thueson" width="125">
                <figcaption>Alisa Thueson - Professional Rafter</figcaption>
            </figure>
            <figure>
                <img src="images/benjamin-rafter.jpg" alt="photo of Benjamin Thomas" width="125">
                <figcaption>Benjamin Thomas - Professional Rafter</figcaption>
            </figure>

        </section>
    </main>
    <footer class="main-footer">
        <p>© 2026 Bonito Rafting Company Douglas Caceres</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="facebook Icon" width="50">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="instagram Icon" width="50">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube-square.svg" alt="Youtube Icon" width="50">
            </a>
        </nav>
    </footer>


</body>

</html>
